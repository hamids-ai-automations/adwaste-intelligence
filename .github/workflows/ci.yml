name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

jobs:
  quality:
    name: Lint, test & render (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -c "import streamlit, pandas, numpy, plotly, openpyxl; print('Runtime imports OK')"

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Run unit & integration tests (pytest)
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Headless AppTest render & workflow smoke check
        run: python scripts/smoke_pages.py

      - name: Upload coverage report
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  security:
    name: Security & secrets guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard against committed secrets files
        run: |
          if git ls-files | grep -E '(^|/)(secrets\.toml|\.env(\..*)?)$' | grep -vE '\.example$'; then
            echo "::error::Secrets or .env files must never be tracked in Git."
            exit 1
          fi
          echo "No committed secrets or .env files found."

      - name: Dependency vulnerability audit (pip-audit)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict --desc on

      - name: Secret scan (gitleaks)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
